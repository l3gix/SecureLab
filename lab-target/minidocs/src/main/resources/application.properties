# Applicazione
spring.application.name=MiniDocs

# Server
server.port=8081
server.address=127.0.0.1

# PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/securelab_minidocs
spring.datasource.username=minidocs_app
spring.datasource.password=${MINIDOCS_DB_PASSWORD}


# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true