# Nome applicazione
spring.application.name=SecureLab

# Configurazione server
server.port=8080
server.address=127.0.0.1

# Connessione PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/securelab
spring.datasource.username=securelab_app
spring.datasource.password=${SECURELAB_DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true